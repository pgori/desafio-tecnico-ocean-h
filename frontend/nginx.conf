server {
  listen 80;

  # SPA: qualquer rota desconhecida devolve o index para o Vue Router resolver.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Mantem front e API na mesma origem dentro do compose, evitando CORS.
  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
  }
}
